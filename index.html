<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barber Berish</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #f5f5f2;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .logo-wrap {
    background: #f5f5f2;
    border-radius: 24px;
    padding: 28px 20px 20px;
    margin-bottom: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .logo-wrap img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    letter-spacing: 2px;
    margin-top: 22px;
    color: #0a0a0a;
  }

  .tagline {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8a8a85;
    margin-top: 40px;
    margin-bottom: 18px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 17px 20px;
    border-radius: 14px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  a.btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: #f5f5f2;
    color: #0a0a0a;
  }

  .btn-secondary {
    background: transparent;
    color: #f5f5f2;
    border: 1.5px solid #3a3a38;
  }

  .btn-secondary:hover, .btn-primary:hover {
    opacity: 0.85;
  }

  svg { width: 18px; height: 18px; flex-shrink: 0; }

  footer {
    margin-top: 44px;
    font-size: 11px;
    color: #4a4a48;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-wrap">
      <img src="Barber_Berish_Whitelogo_dark_background.png" alt="Barber Berish logo">
    </div>

    <p class="tagline">Zottegem</p>

    <div class="buttons">
      <a class="btn btn-primary" href="https://knipklok.be/shops/barber-berish-zottegem" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Plan een afspraak
      </a>

      <a class="btn btn-secondary" href="https://www.instagram.com/barber.berish/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>

      <a class="btn btn-secondary" href="https://www.tiktok.com/@barber_berish" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16.6 5.82s.51.5 0 0A4.278 4.278 0 0 1 15.54 3h-3.09v12.4a2.592 2.592 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg>
        TikTok
      </a>
    </div>

    <footer>BARBER BERISH</footer>
  </div>

</body>
</html>
